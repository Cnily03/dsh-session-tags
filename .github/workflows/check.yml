name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - id: pack
        run: |
          pnpm pack --pack-destination out
          echo "file=$(ls out/*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.file }}
          archive: false
          if-no-files-found: error
